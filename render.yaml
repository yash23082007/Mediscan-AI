services:
  # 1. Express Backend REST API
  - type: web
    name: althea-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV_LENGTH
        value: 16
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_API_KEY
        sync: false

  # 2. Python AI Engine Microservice
  - type: web
    name: althea-ai-engine
    runtime: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AI_API_KEY
        generateValue: true
      - key: MODEL_PATH
        value: ./saved_models
      - key: DATA_PATH
        value: ./data
