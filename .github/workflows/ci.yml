name: CI

on:
  push:
    branches: [main, bugfix]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mediscanai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediscanai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mediscanai
      AI_API_KEY: ci-internal-key
      AI_ENGINE_URL: http://127.0.0.1:5000
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-that-is-longer-than-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-longer-than-32-chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PORT: 3001
      NODE_ENV: development
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.11

      - name: Install frontend and backend dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Install AI dependencies
        run: python -m pip install -r ai-engine/requirements.txt

      - name: Apply database schema and seed questions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql

      - name: Generate isolated synthetic admin credential
        shell: bash
        run: |
          ADMIN_PASSWORD="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "DEMO_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Seed local reviewer account
        working-directory: server
        run: npm run seed:demo

      - name: Run API tests
        working-directory: server
        run: npm test

      - name: Run AI unit and API contract tests
        working-directory: ai-engine
        run: python -B -m unittest discover -s . -p 'test_*.py'

      - name: Lint and build frontend
        working-directory: client
        env:
          API_ORIGIN: http://127.0.0.1:3001
        run: |
          npm run lint
          npm run build

      - name: Install Chromium for browser acceptance
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start real API, AI, and frontend services
        shell: bash
        run: |
          (cd ai-engine && PORT=5000 python app.py > /tmp/mediscan-ai.log 2>&1) &
          (cd server && node src/index.js > /tmp/mediscan-api.log 2>&1) &
          (cd client && API_ORIGIN=http://127.0.0.1:3001 npm run start -- --hostname 127.0.0.1 > /tmp/mediscan-web.log 2>&1) &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mediscan-ai.log /tmp/mediscan-api.log /tmp/mediscan-web.log
          exit 1

      - name: Run patient and reviewer browser journeys
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
